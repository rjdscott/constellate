platform: hydra
fusion:
  rrf_k: 60
  weights: {vector: 1.0, graph: 1.0}
retrieval:
  candidate_multiplier: 5
  graph_seeds: 10
  max_hops: 2
data:
  split_cutoff_quantile: 0.95
  embedding_dim: 256
  random_seed: 42
engines:
  relational:
    dsn: postgresql://constellate:constellate@localhost:15433/constellate
  vector:
    adapter: qdrant
    url: http://localhost:16333
    grpc_port: 16334
  graph:
    adapter: memgraph
    uri: bolt://localhost:17687
  # report-layer knob, not part of the platform fingerprint (see orion.yaml)
  bench:
    quality_tolerance: 0.02
