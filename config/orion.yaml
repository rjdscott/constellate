platform: orion
fusion:
  rrf_k: 60
  weights: {vector: 1.0, graph: 1.0}
retrieval:
  candidate_multiplier: 5
  graph_seeds: 10
  max_hops: 2
data:
  split_cutoff_quantile: 0.95
  embedding_dim: 256
  random_seed: 42
engines:
  relational:
    dsn: postgresql://constellate:constellate@localhost:15432/constellate
  vector:
    adapter: pgvector      # HNSW on halfvec, iterative scans (ADR 0004)
  graph:
    adapter: cte           # cte (default, the thesis) | age (second adapter)

bench:
  # quality-equivalence gate vs Lyra (phase-05 verification): hybrid-arm metric
  # deltas beyond this are a conformance failure, not a finding.
  # Bench-harness parameter, not platform identity — hence top-level and not
  # under engines: PlatformConfig ignores unknown top-level keys, so it stays
  # out of the fingerprint (under engines it was *in* it, contradicting this
  # very comment). Read by report.py straight from the raw yaml.
  quality_tolerance: 0.02
