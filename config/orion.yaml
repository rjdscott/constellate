platform: orion
fusion:
  rrf_k: 60
  weights: {vector: 1.0, graph: 1.0}
retrieval:
  candidate_multiplier: 5
  graph_seeds: 10
  max_hops: 2
data:
  split_cutoff_quantile: 0.95
  embedding_dim: 256
  random_seed: 42
engines:
  relational:
    dsn: postgresql://constellate:constellate@localhost:15432/constellate
  vector:
    adapter: pgvector      # HNSW on halfvec, iterative scans (ADR 0004)
  graph:
    adapter: cte           # cte (default, the thesis) | age (second adapter)
  bench:
    # quality-equivalence gate vs Lyra (phase-05 verification): hybrid-arm
    # metric deltas beyond this are a conformance failure, not a finding.
    # Bench-harness parameter, not platform identity — lives here so it is
    # stated in config, read by report.py from raw yaml (kept out of the
    # PlatformConfig model so lyra's fingerprint stays comparable).
    quality_tolerance: 0.02
