[project]
name = "constellate"
version = "0.1.0"
description = "Three knowledge planes (Lyra, Orion, Hydra) behind one retrieval contract"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "duckdb>=1.3",
    "faiss-cpu>=1.11",
    "hnswlib",
    "kuzu==0.11.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ir-measures>=0.4.3",
    "hdrhistogram>=0.10.7",
    "ranx>=0.3.21",
    "asyncpg>=0.31.0",
    "qdrant-client>=1.18.0",
    "neo4j>=6.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "types-pyyaml",
    "pandas-stubs",
    "httpx",
    "asyncpg-stubs>=0.31.3",
]

[tool.uv.sources]
# ADR 0002: PyPI hnswlib is a stale 0.8.0 sdist; the maintained line lives at the repo tags
hnswlib = { git = "https://github.com/nmslib/hnswlib", tag = "v0.9.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constellate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "scipy.*",
    "pyarrow.*",
    "faiss.*",
    "hnswlib.*",
    "kuzu.*",
    "ir_measures.*",
    "ranx.*",
    "hdrh.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
