name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check --output-format=github src tests scripts bench
      - name: Format
        run: uv run ruff format --check src tests scripts bench
      - name: Types
        run: uv run mypy
      - name: Start Orion + Hydra (conformance runs against the real images)
        run: make up PLATFORM=orion && make up PLATFORM=hydra
      - name: Tests
        run: uv run pytest -q
        env:
          ORION_DSN: postgresql://constellate:constellate@localhost:15432/constellate
          ORION_REQUIRED: "1"  # orion conformance must run, not silently skip
          HYDRA_REQUIRED: "1"  # ditto for hydra (qdrant + memgraph)
      - name: Docs
        run: uv run python scripts/check_docs.py

  ui:
    # independent of the python job — a frontend break shouldn't need engines up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      # corepack at repo root can't see ui/package.json's pinned pnpm and
      # falls back to latest (needs node 22+); action-setup reads the pin.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install (locked)
        run: pnpm install --frozen-lockfile
      - name: Lint + types + build
        run: pnpm lint && pnpm typecheck && pnpm build
