name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check --output-format=github src tests scripts bench
      - name: Format
        run: uv run ruff format --check src tests scripts bench
      - name: Types
        run: uv run mypy
      - name: Start Orion (conformance runs against the real image)
        run: make up PLATFORM=orion
      - name: Tests
        run: uv run pytest -q
        env:
          ORION_DSN: postgresql://constellate:constellate@localhost:15432/constellate
      - name: Docs
        run: uv run python scripts/check_docs.py
