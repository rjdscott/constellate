<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constellate — explorer</title>
    <script>
      // Theme before first paint: a flash of the wrong sky is worse than no sky.
      // Key must stay in sync with THEME_KEY in src/app/Shell.tsx.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('constellate:theme')
        } catch (e) {
          /* storage blocked — fall through to the media query */
        }
        document.documentElement.dataset.theme =
          stored ||
          (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
